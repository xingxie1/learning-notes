# Butterfly 主题配置；未列出的选项沿用主题默认值。
nav:
  fixed: true

menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  分类: /categories/ || fas fa-folder-open
  标签: /tags/ || fas fa-tags
  关于: /about/ || fas fa-user

social:
  'fab fa-github': https://github.com/xingxie1 || GitHub || '#334155'

favicon: /img/favicon.svg
avatar:
  img: /img/avatar.jpg
  effect: false

default_top_img: /img/header.svg
index_img: /img/header.svg
archive_img: /img/header.svg
tag_img: /img/header.svg
category_img: /img/header.svg
background: '#f5f8fc'

cover:
  index_enable: true
  aside_enable: true
  archives_enable: true
  default_cover:
    - /img/card-cover.svg

subtitle:
  enable: true
  effect: false
  source: false
  sub:
    - 把学到的，认真记下来

index_layout: 3
index_post_content:
  method: 1
  length: 180

toc:
  post: true
  page: false
  number: true
  expand: false
  scroll_percent: true

post_copyright:
  enable: false

aside:
  enable: true
  position: right
  card_author:
    enable: true
    description: 学习、实践、复盘；把每一步都留下来。
    button:
      enable: true
      icon: fab fa-github
      text: 查看 GitHub
      link: https://github.com/xingxie1
  card_announcement:
    enable: true
    content: 这里记录学习路上的问题、尝试与收获。
  card_recent_post:
    enable: true
    limit: 5
  card_categories:
    enable: true
  card_tags:
    enable: true
    orderby: name
  card_archives:
    enable: true
  card_webinfo:
    enable: true

search:
  use: local_search
  placeholder: 搜索学习笔记...
  local_search:
    preload: false
    top_n_per_article: 1
    unescape: false

comments:
  use:

share:
  use:

footer:
  owner:
    enable: true
    since: 2026
  custom_text: 持续学习，慢慢整理。

theme_color:
  enable: true
  main: '#547da6'
  paginator: '#547da6'
  button_hover: '#345d87'
  text_selection: '#9ebcdb'
  link_color: '#547da6'
  toc_color: '#547da6'
  scrollbar_color: '#8aaccb'

darkmode:
  enable: true
  button: true
  autoChangeMode: false

math:
  use: katex
  per_page: true
