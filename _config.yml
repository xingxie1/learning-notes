# 网站信息
title: 学习手记
subtitle: 把学到的，认真记下来
description: 记录学习、实践与思考的个人笔记
keywords: 学习笔记, 技术, 实践
author: xingxie1
language: zh-CN
timezone: Asia/Shanghai

# GitHub Pages 项目站点地址
url: https://xingxie1.github.io/learning-notes
root: /learning-notes/
permalink: posts/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# 内容目录
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# 写作
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: []
filename_case: 1
render_drafts: false
post_asset_folder: false
relative_link: false
future: false
syntax_highlighter: highlight.js
highlight:
  auto_detect: false
  line_number: true
  tab_replace: ''
  wrap: true
  hljs: false

# 首页与归档
index_generator:
  path: ''
  per_page: 10
  order_by: -date
per_page: 10
pagination_dir: page
default_category: 未分类
category_map:
tag_map:
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: mtime

# 主题
theme: butterfly

# 本地搜索
search:
  path: search.xml
  field: post
  content: true
  format: html
