<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>前缀和：交互演示</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #000; color: #f5f5f5; font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif; }
    .demo { padding: 22px 18px 25px; border: 1px solid #303030; border-radius: 18px; background: #050505; }
    .header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 20px; }
    .header h2 { margin: 0; font-size: 22px; line-height: 1.3; }
    .tag { padding: 4px 10px; border-radius: 999px; background: #202020; font-family: Georgia, serif; white-space: nowrap; }
    .array { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
    .cell { min-width: 0; padding: 17px 6px 20px; border: 1px solid #202020; border-radius: 12px; text-align: center; background: #050505; transition: background .2s, border-color .2s, color .2s; }
    .cell.active { background: #031c10; border-color: #0c3b21; color: #27ca75; }
    .index { display: block; margin-bottom: 10px; font-size: 17px; font-family: Georgia, serif; }
    .value { display: block; font-size: 29px; font-weight: 700; }
    .controls { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin-top: 18px; }
    label { display: block; font-size: 17px; }
    select { width: 100%; height: 52px; margin-top: 6px; padding: 0 14px; color: #f5f5f5; background: #050505; border: 1px solid #444; border-radius: 28px; font-size: 20px; cursor: pointer; }
    select:focus { outline: 2px solid #16844e; outline-offset: 2px; }
    .result { margin-top: 32px; padding: 0 12px; }
    .result p { margin: 0 0 15px; font-size: 16px; }
    .formula-line { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .formula { font-size: 23px; font-family: Georgia, "Times New Roman", serif; }
    .answer { font-size: 30px; color: #28ca74; font-weight: 700; }
    .direct { margin-top: 14px; font-size: 16px; font-family: Georgia, "Microsoft YaHei", serif; }
    sub { font-size: 65%; }
    @media (max-width: 520px) {
      .demo { padding: 15px 12px 20px; }
      .header h2 { font-size: 17px; }
      .array { gap: 5px; }
      .cell { padding: 12px 3px; }
      .index { margin-bottom: 7px; font-size: 13px; }
      .value { font-size: 22px; }
      .controls { gap: 10px; }
      label { font-size: 14px; }
      select { height: 44px; font-size: 17px; }
      .result { padding: 0 3px; }
      .formula { font-size: 19px; }
      .answer { font-size: 26px; }
    }
  </style>
</head>
<body>
  <section class="demo" aria-label="前缀和区间求和交互演示">
    <div class="header">
      <h2>交互演示：区间求和</h2>
      <span class="tag">n = 5</span>
    </div>
    <div id="array" class="array"></div>
    <div class="controls">
      <label for="left">左端点 l
        <select id="left"></select>
      </label>
      <label for="right">右端点 r
        <select id="right"></select>
      </label>
    </div>
    <div class="result" aria-live="polite">
      <p>利用前缀和</p>
      <div class="formula-line">
        <span id="formula" class="formula"></span>
        <strong id="answer" class="answer"></strong>
      </div>
      <div id="direct" class="direct"></div>
    </div>
  </section>

  <script>
    // 修改这个数组，就能演示其他数据。
    const a = [1, 3, 2, 5, 4];
    const s = [0]; // 1-based 前缀和：s[i] = a[0] + ... + a[i-1]
    for (const x of a) s.push(s.at(-1) + x);

    const array = document.getElementById('array');
    const left = document.getElementById('left');
    const right = document.getElementById('right');
    const formula = document.getElementById('formula');
    const answer = document.getElementById('answer');
    const direct = document.getElementById('direct');
    document.querySelector('.tag').textContent = `n = ${a.length}`;

    for (let i = 1; i <= a.length; ++i) {
      left.add(new Option(i, i));
      right.add(new Option(i, i));
    }
    left.value = 2;
    right.value = 4;

    function render() {
      const l = Number(left.value), r = Number(right.value);
      array.replaceChildren();
      for (let i = 0; i < a.length; ++i) {
        const cell = document.createElement('div');
        cell.className = 'cell' + (i + 1 >= l && i + 1 <= r ? ' active' : '');
        cell.innerHTML = `<span class="index">${i + 1}</span><strong class="value">${a[i]}</strong>`;
        array.appendChild(cell);
      }
      formula.innerHTML = `s<sub>${r}</sub> − s<sub>${l - 1}</sub> = ${s[r]} − ${s[l - 1]}`;
      answer.textContent = s[r] - s[l - 1];
      direct.textContent = `直接相加：${a.slice(l - 1, r).join(' + ')} = ${s[r] - s[l - 1]}`;
    }

    left.addEventListener('change', () => {
      if (Number(left.value) > Number(right.value)) right.value = left.value;
      render();
    });
    right.addEventListener('change', () => {
      if (Number(right.value) < Number(left.value)) left.value = right.value;
      render();
    });
    render();
  </script>
</body>
</html>
